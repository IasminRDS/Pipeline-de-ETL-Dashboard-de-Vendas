name: publicar demo

# Roda o pipeline de verdade no CI e publica o dashboard que ele gera.
# O dashboard.html não é versionado (é artefato), então ele é produzido aqui
# a cada push — o demo no ar é sempre a saída do código atual.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Rodar o pipeline (extract, transform, load)
        run: python etl.py
      - name: Gerar o dashboard
        run: python dashboard.py
      - name: Montar o site
        run: |
          mkdir -p site
          cp dashboard.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
